plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'com.google.gms.google-services'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

android {
    compileSdk 36

    defaultConfig {
        applicationId "com.surajmanshal.mannsign"
        minSdk 21
        targetSdk 36
        // Update your com.google.android.play:feature-delivery:2.0.1 Maven dependency to an Android 14 compatible version! Your current com.google.android.play:feature-delivery:2.0.1 library is incompatible with targetSdkVersion 34 (Android 14), which introduces a backwards-incompatible change to broadcast receivers. As a reminder, from August 31, 2024, Google Play requires all new app releases to target Android 14. Update to the latest library version dependency to avoid app crashes.
        versionCode 17
        versionName "2.4.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "PAYTM_MERCHANT_ID", "\"${localProperties['paytm_merchant_id']}\""
        buildConfigField "String", "PAYTM_MERCHANT_KEY", "\"${localProperties['paytm_merchant_key']}\""
        buildConfigField "String", "ONESIGNAL_APP_ID", "\"${localProperties['onesignal_app_id']}\""
        buildConfigField "String", "BASE_URL", "\"${localProperties['base_url']}\""
        // Payment module toggle. Disabled until the production payment-initiation route is fixed.
        // Flip to "true" to re-enable the PhonePe/PaymentActivity flow. Orders are placed regardless.
        buildConfigField "boolean", "PAYMENTS_ENABLED", "false"
    }

    signingConfigs {
        release {
            storeFile file(localProperties['release_store_file'] ?: 'release.jks')
            storePassword localProperties['release_store_password']
            keyAlias localProperties['release_key_alias']
            keyPassword localProperties['release_key_password']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
//            applicationIdSuffix ".debug"
        }
    }
    defaultConfig {
        // Required when setting minSdkVersion to 20 or lower
        multiDexEnabled true
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        dataBinding true
        viewBinding true
        buildConfig true
    }

    lintOptions{
        checkReleaseBuilds false
        abortOnError false
    }
    namespace 'com.surajmanshal.mannsign'

}

dependencies {

    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.firebase:firebase-messaging-ktx:23.1.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.4'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.0'

    // Custom Animated BottomNavBar
    implementation 'nl.joery.animatedbottombar:library:1.1.0'

    // GLIDE
    implementation 'com.github.bumptech.glide:glide:4.13.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.13.0'

    //navigation
    def nav_version = "2.7.7"
    // Kotlin
    implementation("androidx.navigation:navigation-fragment-ktx:$nav_version")
    implementation("androidx.navigation:navigation-ui-ktx:$nav_version")
    /*// Feature module Support
    implementation("androidx.navigation:navigation-dynamic-features-fragment:$nav_version"){
        exclude group: 'com.google.android.play', module: 'core'
        exclude group: 'com.google.android.play', module: 'feature-delivery'
    }*/
    // Testing Navigation
    androidTestImplementation("androidx.navigation:navigation-testing:$nav_version")

    //room
    def roomVersion = "2.7.0"

    implementation "androidx.room:room-runtime:$roomVersion"
    kapt "androidx.room:room-compiler:$roomVersion"
    implementation "androidx.room:room-ktx:$roomVersion"

    //coroutine
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.0")
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.0'

    // architecture
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.5.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.5.1'

    implementation "androidx.lifecycle:lifecycle-extensions:2.2.0"

    //retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.1.0'

    // ImageKit


    //itext a
    implementation 'com.itextpdf.android:kernel-android:7.2.3'
    implementation 'com.itextpdf.android:layout-android:7.2.3'
    implementation 'com.itextpdf.android:io-android:7.2.3'

    //onesignal
    implementation 'com.onesignal:OneSignal:[4.0.0, 4.99.99]'

    //ios like overscroll ;)
    implementation 'com.github.valkriaine:Bouncy:2.3'

    //color picker
    implementation "com.github.skydoves:colorpickerview:2.2.4"

    //superellipse
    //implementation 'com.github.MicroRJ:android_superellipse:v3.0.0-alpha'

    //for localdate
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:1.1.5")

    // Lottie
    def lottieVersion = "5.2.0"
    implementation "com.airbnb.android:lottie:$lottieVersion"

    // DataStore
    implementation('androidx.datastore:datastore-preferences:1.0.0')
    implementation("androidx.datastore:datastore-preferences-core:1.0.0")

    //Navigation
    /*
    +--- androidx.navigation:navigation-ui-ktx:2.4.2 (*)
+--- androidx.navigation:navigation-dynamic-features-fragment:2.4.2
|    +--- androidx.navigation:navigation-dynamic-features-runtime:2.4.2
|    |    +--- androidx.navigation:navigation-runtime:2.4.2 (*)
|    |    \--- com.google.android.play:core:1.10.2
|    +--- androidx.navigation:navigation-fragment:2.4.2 (*)
|    \--- org.jetbrains.kotlin:kotlin-stdlib:1.6.0 -> 1.7.10 (*)

    * */

    //facebook shimmer
    implementation 'com.facebook.shimmer:shimmer:0.5.0'

    //paytm integration
    //implementation 'com.paytm.appinvokesdk:appinvokesdk:1.6.0'
    implementation(name: 'paytmsdk', ext: 'aar')


    implementation 'com.github.alirezat775:carousel-view:1.1.1'

//    implementation 'phonepe.intentsdk.android.release:IntentSDK:2.1.1'
    implementation 'phonepe.intentsdk.android.release:IntentSDK:2.4.2'

    // IN APP UPDATES --------------------------------------------------------------------
    // This dependency is downloaded from the Google’s Maven repository.
    // So, make sure you also include that repository in your project's build.gradle file.
    implementation "com.google.android.play:app-update:2.1.0"

}